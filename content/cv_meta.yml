speciality: >
  I am a broadly trained molecular and microbial ecologist with principal
  expertise in population genomics and microbial ecology. I specialise in
  developing eco-evolutionary simulations of microbial communities to
  develop hypotheses which I then test using observational data and
  experiments. My research background is a combination of population
  genomics and microbial ecology, with my current research interests
  working to align these two fields to understand the evolution of
  host-microbe relationships. My current work combines eco-evolutionary
  modelling of holobiont evolution, and experimental work with Daphnia to
  determine microbial contributions to host fitness and to understand
  host-microbial responses to environmental perturbations. In addition to
  these areas, I am also actively involved in the application and
  optimisation of new molecular biology protocols for non-model organisms.
